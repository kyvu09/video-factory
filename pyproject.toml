[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "video-factory"
version = "0.1.0"
description = "AI-assisted Video Factory & Animation Engine"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "addict",
    "appdirs",
    "av",
    "colour",
    "diskcache",
    "fontTools",
    "glfw",
    "google-genai>=1.0.0",
    "ipython>=8.18.0",
    "isosurfaces",
    "manimpango>=0.6.0",
    "matplotlib",
    "numpy",
    "Pillow",
    "pydub",
    "pygments",
    "pyperclip",
    "pywavefront",
    "pyyaml",
    "rendercanvas",
    "rich",
    "scipy",
    "setuptools",
    "skia-pathops",
    "soundfile",
    "svgelements>=1.8.1",
    "sympy",
    "tqdm",
    "trimesh",
    "validators",
    "vieneu>=3.6.0",
    "wgpu",
]

[project.scripts]
video-factory = "gui:main"
manimgl = "manimlib.__main__:main"
manim-render = "manimlib.__main__:main"

[tool.setuptools]
py-modules = ["style", "gui"]

[tool.setuptools.packages.find]
where = ["."]
include = ["manimlib*", "components*", "core*"]

[tool.setuptools.package-data]
manimlib = ["*.yml", "shaders/**/*", "tex_templates.yml"]
